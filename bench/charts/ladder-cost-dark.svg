<text x="32.0" y="484.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#a3a19a">Two runs each, 2026-11-16: the whole run&#x27;s fees as OpenRouter billed them, with the hosts&#x27; prompt caches warm from</text>
<text x="32.0" y="502.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#a3a19a">earlier runs (a first run&#x27;s judge pass costs up to $1.60 more); on your own machine they cost hardware and power.</text>
<text x="32.0" y="520.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#a3a19a">Hosted: the reviewer&#x27;s $11.05 was measured; the judge&#x27;s was not recorded and is about $1.80 at list price for the</text>
<text x="32.0" y="538.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#a3a19a">same tokens, so both figures are marked ~. Rules pay no model; running Elasticsearch is not counted.</text>
