<text x="32.0" y="484.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b6964">Two runs each, 2026-11-16, open weights through OpenRouter: the dot is their mean, the bar what they span. One model</text>
<text x="32.0" y="502.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b6964">judges, then reviews its own alerts; where two are named, the second reviews. The tier is the Mac memory a 4-bit build</text>
